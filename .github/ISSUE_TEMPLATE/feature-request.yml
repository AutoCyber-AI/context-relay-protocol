name: Feature Request
description: Propose a new feature or capability for CRP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "I'm trying to ... but CRP doesn't support ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your proposed addition to the specification
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change?
      description: Would this require changes to existing Stable APIs?
      options:
        - "No — purely additive"
        - "Yes — changes existing behavior"
        - "Unsure"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area of the specification is affected?
      options:
        - Core Protocol
        - Extraction Pipeline
        - CKF / Knowledge Fabric
        - API / Schemas
        - Security
        - Deployment
        - Observability
        - Other
    validations:
      required: true
