<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRP Live Checkpoint Console</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px;
  }
  h1 { color: #58a6ff; font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .scenario { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }
  button { background: #238636; color: white; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
  button.deny { background: #da3633; }
  #log { background: #010409; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px; height: 480px; overflow-y: auto; font-family: "SF Mono", Consolas, monospace;
    font-size: 12.5px; margin-top: 16px; }
  .ev { padding: 4px 0; border-bottom: 1px solid #161b22; }
  .ev .kind { color: #58a6ff; font-weight: 600; }
  .ev .detail { color: #c9d1d9; }
  .ev.tool { color: #d29922; }
  .ev.reason { color: #8b949e; font-style: italic; }
  .ev.done { color: #3fb950; font-weight: 600; }
  .ev.error { color: #f85149; font-weight: 600; }
  #checkpoint {
    display: none; background: #3a2a00; border: 2px solid #d29922; border-radius: 8px;
    padding: 16px; margin-top: 16px;
  }
  #checkpoint h2 { color: #d29922; font-size: 15px; margin: 0 0 8px; }
  #checkpoint .row { margin: 4px 0; font-size: 13px; }
  #checkpoint .row b { color: #e3b341; }
  #checkpoint .actions { margin-top: 12px; display: flex; gap: 8px; }
  .status { font-size: 13px; color: #8b949e; margin-left: 12px; }
</style>
</head>
<body>
  <h1>🛡️ CRP Live Checkpoint Console</h1>
  <div class="sub">
    Real agent. Real local LLM. Real human-in-the-loop gate - this page's Approve/Deny
    buttons unblock an actual running Python thread, not a simulation.
    (CHEATSHEET.md §5.6)
  </div>
  <div class="scenario" id="scenario">Loading scenario…</div>
  <button id="startBtn" onclick="startRun()">▶ Start Run</button>
  <span class="status" id="status"></span>

  <div id="checkpoint">
    <h2>🛑 HUMAN APPROVAL REQUIRED</h2>
    <div class="row"><b>Reason:</b> <span id="cpReason"></span></div>
    <div class="row"><b>Question:</b> <span id="cpQuestion"></span></div>
    <div class="row"><b>Context:</b> <span id="cpContext"></span></div>
    <div class="actions">
      <button onclick="decide('approve')">✅ Approve</button>
      <button class="deny" onclick="decide('deny')">🚫 Deny</button>
    </div>
  </div>

  <div id="log"></div>

<script>
let es = null;

function logLine(cls, html) {
  const el = document.createElement('div');
  el.className = 'ev ' + cls;
  el.innerHTML = html;
  const log = document.getElementById('log');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function startRun() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('checkpoint').style.display = 'none';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('status').textContent = 'starting…';
  const resp = await fetch('/api/start');
  const body = await resp.json();
  if (!resp.ok) {
    logLine('error', 'Could not start: ' + (body.error || resp.status));
    document.getElementById('startBtn').disabled = false;
    return;
  }
  document.getElementById('scenario').textContent = 'Scenario: ' + body.question;
  document.getElementById('status').textContent = 'running…';
  connectStream();
}

function connectStream() {
  if (es) es.close();
  es = new EventSource('/api/stream');

  es.addEventListener('provider', (e) => {
    const d = JSON.parse(e.data);
    logLine('reason', `Provider auto-detected: <b>${d.class}</b> (${d.model})`);
  });

  es.addEventListener('step_boundary', (e) => {
    const d = JSON.parse(e.data);
    logLine('reason', `<hr style="border-color:#30363d"><b> - Turn ${d.step} - </b> ${escapeHtml(d.question)}`);
  });

  es.addEventListener('tel', (e) => {
    const d = JSON.parse(e.data);
    const kind = d.type || 'EVENT';
    let html = `<span class="kind">${kind}</span>`;
    if (d.detail) html += ` - <span class="detail">${escapeHtml(d.detail)}</span>`;
    if (d.capability_id) html += ` <span class="detail">[tool: ${d.capability_id}]</span>`;
    if (d.content) html += ` <span class="detail">${escapeHtml(String(d.content)).slice(0,300)}</span>`;
    let cls = 'tel';
    if (kind.startsWith('TOOL_CALL')) cls = 'tool';
    logLine(cls, html);
  });

  es.addEventListener('checkpoint_request', (e) => {
    const d = JSON.parse(e.data);
    logLine('reason', '🛑 Checkpoint requested - waiting for your decision…');
    document.getElementById('cpReason').textContent = d.reason || '';
    document.getElementById('cpQuestion').textContent = d.question || '';
    document.getElementById('cpContext').textContent = JSON.stringify(d.context || {});
    document.getElementById('checkpoint').style.display = 'block';
    document.getElementById('status').textContent = 'AWAITING YOUR APPROVAL';
  });

  es.addEventListener('checkpoint_resolved', (e) => {
    const d = JSON.parse(e.data);
    document.getElementById('checkpoint').style.display = 'none';
    logLine(d.decision === 'approve' ? 'done' : 'error',
      `Checkpoint resolved: <b>${d.decision.toUpperCase()}</b>`);
    document.getElementById('status').textContent = 'running…';
  });

  es.addEventListener('checkpoint_timeout', () => {
    logLine('error', '⏱ Checkpoint timed out - auto-denied (fail-safe default).');
  });

  es.addEventListener('error', (e) => {
    try {
      const d = JSON.parse(e.data);
      logLine('error', 'ERROR: ' + escapeHtml(d.message || 'stream error'));
    } catch (_) { /* connection-level error, ignore */ }
  });

  es.addEventListener('done', () => {
    logLine('done', '✔ Run finished.');
    document.getElementById('status').textContent = 'done';
    document.getElementById('startBtn').disabled = false;
    es.close();
  });
}

async function decide(decision) {
  document.getElementById('checkpoint').style.display = 'none';
  document.getElementById('status').textContent = 'submitting decision…';
  await fetch('/api/decide', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({decision}),
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
