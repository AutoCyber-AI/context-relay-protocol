site_name: CRP™ - Context Relay Protocol
site_description: >-
  Context Relay Protocol (CRP) is the evidence layer for AI security and safety: the open
  HTTP-header standard that proves AI controls operate on every call for EU AI Act, AIUC-1,
  ISO 42001, NIST AI RMF, and SOC 2-for-AI. 58 safety headers · Provider-agnostic · Zero lock-in.
site_url: https://crprotocol.io
site_author: AutoCyber AI Pty Ltd

repo_name: AutoCyber-AI/context-relay-protocol
repo_url: https://github.com/AutoCyber-AI/context-relay-protocol
edit_uri: edit/main/site-docs/

copyright: >-
  &copy; 2025–2026 <strong>AutoCyber AI Pty Ltd</strong> (ABN 22 697 087 166) ·
  Sydney, Australia ·
  Context Relay Protocol™ and CRP™ are trademarks of Constantinos Vidiniotis / AutoCyber AI Pty Ltd ·
  <br/>
  <a href="/legal/privacy-policy/">Privacy</a> ·
  <a href="/legal/cookie-policy/">Cookies</a> ·
  <a href="/legal/information-security-policy/">Information Security</a> ·
  <a href="/legal/ai-policy/">AI Policy</a> ·
  <a href="/terms-of-service/">Terms</a> ·
  <a href="/legal/">Legal Hub</a> ·
  <a href="https://github.com/AutoCyber-AI/context-relay-protocol/blob/main/LICENSE.md">Elastic License 2.0</a>
  <br/>
  Contact: <a href="mailto:info@crprotocol.io">info@crprotocol.io</a> ·
  Security: <a href="mailto:security@crprotocol.io">security@crprotocol.io</a> ·
  AI Governance: <a href="mailto:ai-governance@crprotocol.io">ai-governance@crprotocol.io</a> ·
  Standards: <a href="mailto:standards@crprotocol.io">standards@crprotocol.io</a>
  <br/>
  Aligned with <strong>AIUC-1</strong>, <strong>OWASP Top 10 (2025)</strong>, <strong>ISO/IEC 42001:2023</strong>, <strong>EU AI Act (Regulation 2024/1689)</strong>, <strong>ISO/IEC 27001:2022</strong>, and <strong>NIST AI RMF</strong>.

docs_dir: site-docs

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    # Sidebar navigation (no horizontal tabs - prevents nav overflow on docs-heavy site)
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.prune
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - toc.follow
    - header.autohide
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - content.action.edit
    - content.action.view
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo-small.png
  favicon: assets/favicon/favicon.ico
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ticker.js

hooks:
  - hooks/mkdocs_hooks.py

plugins:
  - autorefs:
      resolve_closest: true
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          paths: [crp]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
  - meta
  - tags:
      tags_hierarchy: true
      listings_toc: false
  - privacy:
      enabled: true
      links: true
      assets: true
  # Note: optimize is powerful but requires pngquant/oxipng/svgo binaries.
  # Images are already optimized manually; enable locally only if those tools are installed.
  # - optimize:
  #     enabled: true
  - minify:
      minify_html: true
  - redirects:
      redirect_maps: {}
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false
  - git-authors:
      strict: false
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - hero-logo
      auto_caption: false


extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AutoCyber-AI/context-relay-protocol
      name: CRP on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/autocyberai
      name: AutoCyber AI on X
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/autocyberai
      name: AutoCyber AI on LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:info@crprotocol.io
      name: General enquiries
    - icon: fontawesome/solid/shield-halved
      link: mailto:security@crprotocol.io
      name: Report a security issue
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thank you for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/AutoCyber-AI/context-relay-protocol/issues/new?title=[Docs+feedback]" target="_blank" rel="noopener">opening an issue</a>.

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - site-docs
        - docs
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - abbr
  - pymdownx.tasklist:
      custom_checkbox: true

